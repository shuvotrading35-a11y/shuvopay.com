name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ════════════════════════════════════════════════════════════
  # Backend Tests
  # ════════════════════════════════════════════════════════════
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shuvopay_test
          POSTGRES_USER: shuvopay
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt aiosqlite pytest-asyncio

      - name: Generate test RSA keys
        run: |
          openssl genrsa -out private.pem 2048
          openssl rsa -in private.pem -pubout -out public.pem
          echo "JWT_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat private.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "JWT_PUBLIC_KEY<<EOF" >> $GITHUB_ENV
          cat public.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run tests (skip if no tests exist)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://shuvopay:testpassword@localhost:5432/shuvopay_test
          REDIS_URL: redis://localhost:6379/0
          AES_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: testpass123
          CORS_ORIGINS: http://localhost:3000
        run: |
          if [ -d "tests/" ]; then
            pytest tests/ -v --tb=short || true
          else
            echo "No tests found, skipping."
          fi

  # ════════════════════════════════════════════════════════════
  # Frontend Checks
  # ════════════════════════════════════════════════════════════
  test-frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check merchant panel
        working-directory: merchant-panel
        run: |
          npm install
          npm run lint || true
          npm run type-check || true

      - name: Check admin panel
        working-directory: admin-panel
        run: |
          npm install
          npm run lint || true
          npm run type-check || true
