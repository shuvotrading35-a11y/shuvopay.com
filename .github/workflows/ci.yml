name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/shuvopay

jobs:
  # ════════════════════════════════════════════════════════════
  # Backend Tests
  # ════════════════════════════════════════════════════════════
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shuvopay_test
          POSTGRES_USER: shuvopay
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt aiosqlite pytest-asyncio

      - name: Generate test RSA keys
        run: |
          openssl genrsa -out private.pem 2048
          openssl rsa -in private.pem -pubout -out public.pem
          echo "JWT_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat private.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "JWT_PUBLIC_KEY<<EOF" >> $GITHUB_ENV
          cat public.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://shuvopay:testpassword@localhost:5432/shuvopay_test
          REDIS_URL: redis://localhost:6379/0
          AES_ENCRYPTION_KEY: ${{ secrets.AES_ENCRYPTION_KEY_TEST || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: testpass123
          CORS_ORIGINS: http://localhost:3000
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://shuvopay:testpassword@localhost:5432/shuvopay_test
          REDIS_URL: redis://localhost:6379/0
          AES_ENCRYPTION_KEY: ${{ secrets.AES_ENCRYPTION_KEY_TEST || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: testpass123
          CORS_ORIGINS: http://localhost:3000
        run: |
          pytest tests/integration/ -v --tb=short

  # ════════════════════════════════════════════════════════════
  # Frontend Lint + Type Check
  # ════════════════════════════════════════════════════════════
  test-frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Lint + typecheck merchant panel
        working-directory: merchant-panel
        run: |
          npm ci
          npm run lint
          npm run type-check

      - name: Lint + typecheck admin panel
        working-directory: admin-panel
        run: |
          npm ci
          npm run lint
          npm run type-check

  # ════════════════════════════════════════════════════════════
  # Build + Push Docker Images (main branch only)
  # ════════════════════════════════════════════════════════════
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push merchant panel
        uses: docker/build-push-action@v5
        with:
          context: ./merchant-panel
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-merchant:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-merchant:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push admin panel
        uses: docker/build-push-action@v5
        with:
          context: ./admin-panel
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════
  # Deploy (SSH to production)
  # ════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://shuvopay.com

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/shuvopay

            # Pull latest images
            docker compose pull

            # Run DB migrations (zero-downtime — new schema compatible with old code)
            docker compose run --rm backend alembic upgrade head

            # Rolling restart — backend first, then panels, then workers
            docker compose up -d --no-deps backend
            sleep 10

            # Smoke test
            curl -f https://api.shuvopay.com/health || exit 1

            docker compose up -d --no-deps merchant-panel admin-panel worker

            # Final smoke test
            curl -f https://api.shuvopay.com/health/ready || exit 1

            echo "Deployment successful: $(date)"
            docker compose ps
